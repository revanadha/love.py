<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untuk Kamu ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#14060f;--rose:#ff3d6e;--blush:#ffd1dc;--gold:#ffc86b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--blush);overflow:hidden;font-family:'Quicksand',system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 9vh;text-align:center;pointer-events:none}
h1{font-family:'Dancing Script',cursive,serif;font-size:clamp(2.4rem,8vw,4.5rem);margin:0 0 .3em;color:#fff;text-shadow:0 0 24px var(--rose),0 0 60px var(--rose)}
#msg{min-height:3.2em;max-width:30em;font-size:clamp(1rem,2.6vw,1.2rem);line-height:1.6;margin:0}
#msg::after{content:"|";margin-left:2px;color:var(--gold);animation:b 1s steps(1) infinite}
.hint{margin-top:1.2em;font-size:.85rem;opacity:.6}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#msg::after{animation:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="ui">
  <h1 id="title">Untuk Rafa Haisa Jasmine</h1>
  <p id="msg" aria-live="polite"></p>
  <p class="hint">Sentuh layar untuk menebar cinta</p>
</div>
<script>
// ===== Ubah teks di sini (atau pakai ?nama=Sayang di akhir link) =====
const params = new URLSearchParams(location.search);
const NAMA = params.get('nama') || 'Kamu';
const PESAN = [
  'Terima kasih sudah hadir di hari-hariku.',
  'Kamu bikin hal sederhana terasa istimewa.',
  'Semoga kamu selalu bahagia, hari ini dan seterusnya. ❤'
];
// =====================================================================
document.getElementById('title').textContent = 'Untuk ' + NAMA;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, scale, particles = [], floaters = [], bursts = [], mouse = {x:-999,y:-999};
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

function heart(t){ // rumus kurva hati
  return {x:16*Math.pow(Math.sin(t),3),
          y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))};
}
function resize(){
  dpr = Math.min(devicePixelRatio||1,2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  scale = Math.min(W,H*1.1)/42;
  build();
}
function build(){
  particles = [];
  const n = W<600 ? 900 : 1600;
  for(let i=0;i<n;i++){
    const t = Math.random()*Math.PI*2, k = Math.sqrt(Math.random()); // isi hati
    const p = heart(t);
    particles.push({
      tx:p.x*k, ty:p.y*k, x:Math.random()*W, y:Math.random()*H, vx:0, vy:0,
      r:Math.random()*1.6+.6, h:Math.random()*30+340, a:Math.random()*.5+.5
    });
  }
}
function spawnFloater(x,y,big){
  floaters.push({x:x??Math.random()*W, y:y??H+20, s:big?Math.random()*14+10:Math.random()*10+6,
    vy:-(Math.random()*.8+.4), vx:(Math.random()-.5)*(big?3:.5), a:1, ph:Math.random()*6.28,
    h:Math.random()*30+340, burst:!!big});
}
function drawHeart(x,y,s,fill){
  ctx.beginPath();
  for(let t=0;t<=Math.PI*2;t+=.2){const p=heart(t);ctx.lineTo(x+p.x*s/16,y+p.y*s/16);}
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
let time = 0;
function frame(){
  time += .016;
  ctx.fillStyle = 'rgba(20,6,15,.28)'; ctx.fillRect(0,0,W,H);
  const beat = 1 + (calm?0:.06*Math.pow(Math.sin(time*3),8) + .03*Math.sin(time*1.5));
  const cx = W/2, cy = H*.38;
  ctx.globalCompositeOperation = 'lighter';
  for(const p of particles){
    const gx = cx + p.tx*scale*beat, gy = cy + p.ty*scale*beat;
    const dx = p.x-mouse.x, dy = p.y-mouse.y, d2 = dx*dx+dy*dy;
    if(d2<9000){const f=(9000-d2)/9000*2.2,d=Math.sqrt(d2)||1;p.vx+=dx/d*f;p.vy+=dy/d*f;}
    p.vx += (gx-p.x)*.035; p.vy += (gy-p.y)*.035;
    p.vx *= .88; p.vy *= .88; p.x += p.vx; p.y += p.vy;
    ctx.fillStyle = `hsla(${p.h},100%,62%,${p.a})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  if(!calm && Math.random()<.08) spawnFloater();
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.ph += .03; f.x += f.vx + Math.sin(f.ph)*.4; f.y += f.vy;
    if(f.burst){f.vy += .04; f.a -= .012;} else f.a = Math.min(1,f.y/(H*.3));
    if(f.a<=0 || f.y<-30 || f.y>H+60){floaters.splice(i,1);continue;}
    drawHeart(f.x,f.y,f.s*1.6,`hsla(${f.h},100%,${f.burst?70:60}%,${Math.max(f.a,0)*.85})`);
  }
  requestAnimationFrame(frame);
}
function burst(x,y){for(let i=0;i<16;i++){spawnFloater(x,y,true);}
  for(const p of particles){const dx=p.x-x,dy=p.y-y,d=Math.hypot(dx,dy)||1; if(d<200){p.vx+=dx/d*6;p.vy+=dy/d*6;}}}
addEventListener('resize',resize);
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;});
addEventListener('pointerleave',()=>{mouse.x=mouse.y=-999;});
addEventListener('pointerdown',e=>{mouse.x=e.clientX;mouse.y=e.clientY;burst(e.clientX,e.clientY);});

// mesin ketik
const msgEl = document.getElementById('msg');
(async function type(){
  const wait = ms=>new Promise(r=>setTimeout(r,ms));
  await wait(1200);
  for(;;){
    for(const line of PESAN){
      for(const ch of line){msgEl.textContent+=ch;await wait(55);}
      await wait(2200);
      while(msgEl.textContent.length){msgEl.textContent=msgEl.textContent.slice(0,-1);await wait(18);}
      await wait(300);
    }
  }
})();
resize(); frame();
</script>
</body>
</html>
